# loki-prune configuration example

# Loki API integration settings
loki:
  # Base URL of your Loki instance
  url: "http://127.0.0.1:3100"
  timeout: "30s"

  # API synchronization hooks (https://github.com/grafana/loki/issues/6876)
  flush_before_rotate: true   # Calls POST /flush to push memory chunks to disk before rotating
  reload_after_rotate: true   # Calls POST /flush to ensure storage synchronization post-rotation

# Daemon / scheduling settings
daemon:
  # Operational mode:
  # - "poll" (default): Stateless interval-based polling. Lowest resource footprint,
  #   zero inotify handles, ideal for large chunk sets or container environments.
  # - "fsevent": Real-time in-memory tracking via fsnotify with recursive directory
  #   watching and automatic event cooldown.
  mode: "poll"

  # Evaluation frequency for poll mode (and safety heartbeat for fsevent mode)
  interval: "5m"

  # Cooldown period used in "fsevent" mode. When Loki flushes a burst of chunk writes,
  # loki-prune waits for I/O to quiet down for this duration before evaluating directory size.
  cooldown: "5s"

  # Adaptive polling: dynamically reduces sleep duration down to min_interval
  # as storage approaches or exceeds trigger_size.
  adaptive: true
  min_interval: "5s"

  # Logging configuration
  log_level: "info"           # debug, info, warn, error
  log_type: "text"            # "text" or "json"

# Monitored directory paths
paths:
  - name: "loki-chunks"
    path: "/share/Data/metrics/loki/chunks"
    archive_dir: "/share/Data/metrics/loki/archive"

    # Emergency disk guard: triggers rotation if parent filesystem usage exceeds percentage
    disk_guard_percent: 90.0

    # Size thresholds (supports B, KB, KiB, MB, MiB, GB, GiB, TB, TiB)
    trigger_size: "48GB"       # Begin rotation when directory exceeds 48 GB
    target_size: "40GB"        # Move chunks until directory is reduced to 40 GB

    rotation:
      # Keep up to X rotated archives; older archives are pruned automatically
      max_rotations: 10

      # Compression settings
      compress: true
      type: "zstd"             # "zstd", "gzip", or "none"
      level: 19                # Compression level (1-19 for zstd; 19 is highest compression)

      # Delayed compression options
      delay:
        # Number of recent rotation batches to keep uncompressed before compressing them
        rotations: 0
        # Wait duration before compressing rotated items (e.g. "1m" to allow flushing)
        age: "1m"
